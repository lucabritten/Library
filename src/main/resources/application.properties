spring.application.name=exercise

spring.jpa.open-in-view=false
# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5431/library
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Bei jedem start wird gegen die flyways-schemas validiert
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.data.web.pageable.max-page-size=100

#Spring Health-check
server.port=8080
# Prometheus auf seperaten Port
management.server.port=8081
management.endpoints.web.exposure.include=prometheus,health

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-components=always
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=SCOPE_admin
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging
logging.level.de.htwsaar.library=INFO
# logging.structured.format.console=ecs

library.books.normalize-isbn=true
