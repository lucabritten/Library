services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library} # Library als Fallback, falls keine Systemvariable gesetzt
    ports:
      - "5431:5432" # Nur für lokal, um auf die DB von außen zugreifen zu können, prod kommuniziert intern
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/library
      SPRING_DATASOURCE_USERNAME: library
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-library}
      SPRING_PROFILES_ACTIVE: seed
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LIBRARY_JWT_PUBLIC_KEY: file:/run/keys/public.pem
      LIBRARY_JWT_PRIVATE_KEY: file:/run/keys/private.pem
      LIBRARY_JWT_TTL: 15m
    volumes:
      - ./keys:/run/keys:ro
    read_only:
      true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
